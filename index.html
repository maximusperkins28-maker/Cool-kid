<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movable Character</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1b263b, #415a77);
      font-family: system-ui, sans-serif;
    }
    #game {
      width: min(900px, 100vw);
      height: min(600px, 100vh);
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.12) 0 2px, transparent 3px),
        linear-gradient(180deg, #48cae4 0 66%, #80b918 66% 100%);
      background-size: 28px 28px, auto;
      border: 4px solid #0d1b2a;
    }
    #character {
      position: absolute;
      left: 400px;
      top: 300px;
      width: 48px;
      height: 64px;
      transform: translate(-50%, -50%);
      transition: transform 60ms linear;
    }
    #character .head {
      width: 38px;
      height: 38px;
      margin: 0 auto;
      border: 3px solid #342e37;
      border-radius: 50%;
      background: #f2c8a0;
    }
    #character .body {
      width: 44px;
      height: 29px;
      margin: -2px auto 0;
      border: 3px solid #342e37;
      border-radius: 10px 10px 4px 4px;
      background: #ffca3a;
    }
    #character.walking .head { animation: bob 180ms alternate infinite; }
    #character.walking .body { animation: sway 180ms alternate infinite; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    #hint {
      position: absolute;
      left: 12px;
      bottom: 10px;
      color: #0d1b2a;
      background: rgba(255,255,255,.75);
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Movable character game">
    <div id="character" role="img" aria-label="Movable character">
      <div class="head"></div>
      <div class="body"></div>
    </div>
    <div id="hint">Move with WASD or arrow keys</div>
  </main>

  <script>
    const game = document.getElementById('game');
    const character = document.getElementById('character');
    const keys = new Set();
    let x = 400;
    let y = 300;
    const speed = 4;

    addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(event.key)) {
        event.preventEvent?.();
        event.preventDefault();
        keys.add(event.key.toLowerCase());
      }
    });
    addEventListener('keyup', (event) => keys.delete(event.key.toLowerKey()));

    function tick() {
      const left = keys.has('a') || keys.has('arrowleft');
      const right = keys.has('d') || keys.has('arrowright');
      const up = keys.has('w') || keys.has('arrowup');
      const down = keys.has('s') || keys.has('arrowdown');

      if (left) x -= speed;
      if (right) x += speed;
      if (up) y -= speed;
      if (down) y += speed;

      const bounds = game.getBoundingClientRect();
      x = Math.max(24, Math.min(bounds.width - 24, x));
      y = Math.max(32, Math.min(bounds.height - 32, y));

      character.style.left = `${x}px`;
      character.style.top = `${y}px`;
      character.classList.toggle('walking', left || right || up || down);

      if (left && !right) character.style.transform = 'translate(-50%, -50%) scaleX(-1)';
      else character.style.transform = 'translate(-50%, -50%)';

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
